<text x="410" y="23" text-anchor="middle" fill="#8b949e" font-size="12.5">dtc verify - supported, contradicted, stale. all from evidence</text>
<g class="g0"><text x="22" y="64" style="animation:l0_0 36.0s linear infinite"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#e6edf3" font-weight="600">dtc verify billing-webhook-signature</tspan></text><text x="22" y="85" style="animation:l0_1 36.0s linear infinite"><tspan fill="#e6edf3" font-weight="600">Billing Webhook Signature Verification</tspan></text><text x="22" y="106" style="animation:l0_2 36.0s linear infinite"><tspan fill="#8b949e">Claim: Incoming billing webhooks verify the provider&#x27;s signature.</tspan></text><text x="22" y="127" style="animation:l0_3 36.0s linear infinite"><tspan fill="#e6edf3" font-weight="600">Status: </tspan><tspan fill="#3fb950" font-weight="600">SUPPORTED</tspan></text><text x="22" y="148" style="animation:l0_4 36.0s linear infinite"><tspan fill="#e6edf3">Why:</tspan></text><text x="22" y="169" style="animation:l0_5 36.0s linear infinite"><tspan fill="#e6edf3">  - Signature verification behavior evidence was found.</tspan></text><text x="22" y="190" style="animation:l0_6 36.0s linear infinite"><tspan fill="#e6edf3">  - A test exercises signature behavior.</tspan></text><text x="22" y="211" style="animation:l0_7 36.0s linear infinite"><tspan fill="#e6edf3">Supporting evidence:</tspan></text><text x="22" y="232" style="animation:l0_8 36.0s linear infinite"><tspan fill="#79c0ff">  - src/billing/stripe-webhook.ts  </tspan><tspan fill="#3fb950">[strong]</tspan></text><text x="22" y="253" style="animation:l0_9 36.0s linear infinite"><tspan fill="#8b949e">      Verifies the provider&#x27;s webhook signature.</tspan></text><text x="22" y="274" style="animation:l0_10 36.0s linear infinite"><tspan fill="#79c0ff">  - tests/stripe-signature.test.ts  </tspan><tspan fill="#d29922">[moderate]</tspan></text><text x="22" y="295" style="animation:l0_11 36.0s linear infinite"><tspan fill="#8b949e">      Test exercises webhook signature behavior.</tspan></text></g><g class="g1"><text x="22" y="64" style="animation:l1_0 36.0s linear infinite"><tspan fill="#8b949e"># ...the webhook handler gets replaced by an edition stub</tspan></text><text x="22" y="85" style="animation:l1_1 36.0s linear infinite"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#e6edf3" font-weight="600">dtc scan &amp;&amp; dtc verify billing-webhook-signature</tspan></text><text x="22" y="106" style="animation:l1_2 36.0s linear infinite"><tspan fill="#e6edf3" font-weight="600">Status: </tspan><tspan fill="#f85149" font-weight="600">CONTRADICTED</tspan></text><text x="22" y="127" style="animation:l1_3 36.0s linear infinite"><tspan fill="#e6edf3">Why:</tspan></text><text x="22" y="148" style="animation:l1_4 36.0s linear infinite"><tspan fill="#e6edf3">  - A billing webhook endpoint exists in name, but it is a disabled stub.</tspan></text><text x="22" y="169" style="animation:l1_5 36.0s linear infinite"><tspan fill="#e6edf3">  - No signature verification evidence was found anywhere in the scan.</tspan></text><text x="22" y="190" style="animation:l1_6 36.0s linear infinite"><tspan fill="#f85149" font-weight="600">Contradictions:</tspan></text><text x="22" y="211" style="animation:l1_7 36.0s linear infinite"><tspan fill="#f85149">  - The billing webhook endpoint cannot verify signatures</tspan></text><text x="22" y="232" style="animation:l1_8 36.0s linear infinite"><tspan fill="#f85149">    because it is a disabled stub.</tspan></text><text x="22" y="253" style="animation:l1_9 36.0s linear infinite"><tspan fill="#d29922">      claimed:  </tspan><tspan fill="#e6edf3">pages/api/stripe/webhook.ts is named and routed</tspan></text><text x="22" y="274" style="animation:l1_10 36.0s linear infinite"><tspan fill="#e6edf3">                as a billing webhook endpoint.</tspan></text><text x="22" y="295" style="animation:l1_11 36.0s linear infinite"><tspan fill="#d29922">      observed: </tspan><tspan fill="#e6edf3">The handler&#x27;s only behavior is a 404/501 response.</tspan></text></g><g class="g2"><text x="22" y="64" style="animation:l2_0 36.0s linear infinite"><tspan fill="#8b949e"># restore the handler...</tspan></text><text x="22" y="85" style="animation:l2_1 36.0s linear infinite"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#e6edf3" font-weight="600">dtc scan &amp;&amp; dtc verify billing-webhook-signature</tspan></text><text x="22" y="106" style="animation:l2_2 36.0s linear infinite"><tspan fill="#e6edf3" font-weight="600">Status: </tspan><tspan fill="#3fb950" font-weight="600">SUPPORTED</tspan></text><text x="22" y="127" style="animation:l2_3 36.0s linear infinite"><tspan fill="#8b949e"># ...then change the implementation without re-verifying</tspan></text><text x="22" y="148" style="animation:l2_4 36.0s linear infinite"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#e6edf3" font-weight="600">dtc scan &amp;&amp; dtc verify --list</tspan></text><text x="22" y="169" style="animation:l2_5 36.0s linear infinite"><tspan fill="#79c0ff" font-weight="600">  billing-webhook-signature</tspan></text><text x="22" y="190" style="animation:l2_6 36.0s linear infinite"><tspan fill="#e6edf3">    last status: </tspan><tspan fill="#3fb950">SUPPORTED</tspan><tspan fill="#e6edf3">   freshness: </tspan><tspan fill="#d29922" font-weight="600">STALE</tspan></text><text x="22" y="211" style="animation:l2_7 36.0s linear infinite"><tspan fill="#8b949e">      changed since verification: </tspan><tspan fill="#79c0ff">src/billing/stripe-webhook.ts</tspan></text><text x="22" y="232" style="animation:l2_8 36.0s linear infinite"><tspan fill="#8b949e">Evidence decides. Weak evidence creates uncertainty, not confidence.</tspan></text></g>
