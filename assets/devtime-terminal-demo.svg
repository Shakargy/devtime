<text x="410" y="23" text-anchor="middle" fill="#8b949e" font-size="12.5">devtime demo - local scan, no cloud, no AI</text>
<g class="g0"><text x="22" y="64" style="animation:l0_0 30.0s linear infinite"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#e6edf3" font-weight="600">pipx install devtime-ei</tspan></text><text x="22" y="85" style="animation:l0_1 30.0s linear infinite"><tspan fill="#8b949e">  installed package </tspan><tspan fill="#e6edf3">devtime-ei 0.1.1</tspan><tspan fill="#8b949e">, installed using Python 3.11</tspan></text><text x="22" y="106" style="animation:l0_2 30.0s linear infinite"><tspan fill="#8b949e">  These apps are now globally available</tspan></text><text x="22" y="127" style="animation:l0_3 30.0s linear infinite"><tspan fill="#8b949e">    - </tspan><tspan fill="#79c0ff" font-weight="600">dtc</tspan></text><text x="22" y="148" style="animation:l0_4 30.0s linear infinite"><tspan fill="#3fb950" font-weight="600">done!</tspan></text><text x="22" y="169" style="animation:l0_5 30.0s linear infinite"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#e6edf3" font-weight="600">dtc demo init</tspan></text><text x="22" y="190" style="animation:l0_6 30.0s linear infinite"><tspan fill="#3fb950" font-weight="600">Demo repository created</tspan><tspan fill="#e6edf3"> at ./devtime-demo-saas</tspan></text><text x="22" y="211" style="animation:l0_7 30.0s linear infinite"><tspan fill="#e6edf3">Next:</tspan></text><text x="22" y="232" style="animation:l0_8 30.0s linear infinite"><tspan fill="#79c0ff">  cd devtime-demo-saas</tspan></text><text x="22" y="253" style="animation:l0_9 30.0s linear infinite"><tspan fill="#79c0ff">  dtc init</tspan></text><text x="22" y="274" style="animation:l0_10 30.0s linear infinite"><tspan fill="#79c0ff">  dtc scan</tspan></text><text x="22" y="295" style="animation:l0_11 30.0s linear infinite"><tspan fill="#79c0ff">  dtc concepts</tspan></text><text x="22" y="316" style="animation:l0_12 30.0s linear infinite"><tspan fill="#79c0ff">  dtc explain &quot;Billing Webhooks&quot;</tspan></text></g><g class="g1"><text x="22" y="64" style="animation:l1_0 30.0s linear infinite"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#e6edf3" font-weight="600">dtc init</tspan></text><text x="22" y="85" style="animation:l1_1 30.0s linear infinite"><tspan fill="#3fb950" font-weight="600">DevTime initialized.</tspan><tspan fill="#e6edf3"> Local memory at .devtime/devtime.sqlite</tspan></text><text x="22" y="106" style="animation:l1_2 30.0s linear infinite"><tspan fill="#8b949e">AI disabled. Cloud disabled. Telemetry off. MCP read-only.</tspan></text><text x="22" y="127" style="animation:l1_3 30.0s linear infinite"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#e6edf3" font-weight="600">dtc scan</tspan></text><text x="22" y="148" style="animation:l1_4 30.0s linear infinite"><tspan fill="#8b949e">Scanning locally. No code execution. No network.</tspan></text><text x="22" y="169" style="animation:l1_5 30.0s linear infinite"><tspan fill="#3fb950" font-weight="600">Scan complete.</tspan><tspan fill="#e6edf3"> Scanned 15 files, 38 signals, 5 concepts in 0.14s.</tspan></text><text x="22" y="190" style="animation:l1_6 30.0s linear infinite"><tspan fill="#8b949e">Nothing left this machine. Run dtc concepts to inspect.</tspan></text><text x="22" y="211" style="animation:l1_7 30.0s linear infinite"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#e6edf3" font-weight="600">dtc concepts</tspan></text><text x="22" y="232" style="animation:l1_8 30.0s linear infinite"><tspan fill="#e6edf3" font-weight="600">Detected concepts</tspan></text><text x="22" y="253" style="animation:l1_9 30.0s linear infinite"><tspan fill="#e6edf3">1. Billing Webhooks     </tspan><tspan fill="#79c0ff">confidence: high    </tspan><tspan fill="#d29922">debt: medium</tspan></text><text x="22" y="274" style="animation:l1_10 30.0s linear infinite"><tspan fill="#e6edf3">2. Authentication       </tspan><tspan fill="#79c0ff">confidence: high    </tspan><tspan fill="#3fb950">debt: low</tspan></text><text x="22" y="295" style="animation:l1_11 30.0s linear infinite"><tspan fill="#e6edf3">3. Background Jobs      </tspan><tspan fill="#79c0ff">confidence: medium  </tspan><tspan fill="#f85149">debt: high</tspan></text><text x="22" y="316" style="animation:l1_12 30.0s linear infinite"><tspan fill="#e6edf3">4. Data Export          </tspan><tspan fill="#79c0ff">confidence: medium  </tspan><tspan fill="#f85149">debt: high</tspan></text><text x="22" y="337" style="animation:l1_13 30.0s linear infinite"><tspan fill="#e6edf3">5. Admin Permissions    </tspan><tspan fill="#79c0ff">confidence: medium  </tspan><tspan fill="#f85149">debt: high</tspan></text></g><g class="g2"><text x="22" y="64" style="animation:l2_0 30.0s linear infinite"><tspan fill="#3fb950" font-weight="600">$ </tspan><tspan fill="#e6edf3" font-weight="600">dtc explain &quot;Billing Webhooks&quot;</tspan></text><text x="22" y="85" style="animation:l2_1 30.0s linear infinite"><tspan fill="#e6edf3" font-weight="600">Concept: Billing Webhooks</tspan></text><text x="22" y="106" style="animation:l2_2 30.0s linear infinite"><tspan fill="#e6edf3" font-weight="600">Supported claims:</tspan></text><text x="22" y="127" style="animation:l2_3 30.0s linear infinite"><tspan fill="#e6edf3">  - Billing Webhooks is present and supported by behavior evidence.</tspan></text><text x="22" y="148" style="animation:l2_4 30.0s linear infinite"><tspan fill="#79c0ff">      confidence: 0.86  </tspan><tspan fill="#8b949e">evidence: src/billing/stripe-webhook.ts</tspan></text><text x="22" y="169" style="animation:l2_5 30.0s linear infinite"><tspan fill="#e6edf3">  - Billing Webhooks has active route handling.</tspan></text><text x="22" y="190" style="animation:l2_6 30.0s linear infinite"><tspan fill="#79c0ff">      confidence: 0.82  </tspan><tspan fill="#8b949e">evidence: src/billing/stripe-webhook.ts</tspan></text><text x="22" y="211" style="animation:l2_7 30.0s linear infinite"><tspan fill="#e6edf3">  - Billing Webhooks verifies webhook signatures.</tspan></text><text x="22" y="232" style="animation:l2_8 30.0s linear infinite"><tspan fill="#79c0ff">      confidence: 0.85  </tspan><tspan fill="#8b949e">evidence: src/billing/stripe-webhook.ts</tspan></text><text x="22" y="253" style="animation:l2_9 30.0s linear infinite"><tspan fill="#d29922" font-weight="600">Uncertainty:</tspan></text><text x="22" y="274" style="animation:l2_10 30.0s linear infinite"><tspan fill="#d29922">  - No decision was found explaining key choices for Billing Webhooks.</tspan></text><text x="22" y="295" style="animation:l2_11 30.0s linear infinite"><tspan fill="#e6edf3" font-weight="600">Understanding Score: </tspan><tspan fill="#d2a8ff" font-weight="600">58 / 100</tspan></text><text x="22" y="316" style="animation:l2_12 30.0s linear infinite"><tspan fill="#e6edf3" font-weight="600">Understanding Debt: </tspan><tspan fill="#d29922" font-weight="600">medium</tspan></text><text x="22" y="337" style="animation:l2_13 30.0s linear infinite"><tspan fill="#8b949e">No claim without evidence. Weak evidence creates uncertainty,</tspan></text><text x="22" y="358" style="animation:l2_14 30.0s linear infinite"><tspan fill="#8b949e">not confidence.</tspan></text></g>
